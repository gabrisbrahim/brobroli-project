<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Tech Obsidian Gradients -->
    <radialGradient id="badgeGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14281f"/>
      <stop offset="60%" stop-color="#0b1310"/>
      <stop offset="100%" stop-color="#060908"/>
    </radialGradient>

    <!-- Neon Cyber Green to Electric Volt -->
    <linearGradient id="voltSpeed" x1="120" y1="110" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#05D975"/>
      <stop offset="100%" stop-color="#008F48"/>
    </linearGradient>

    <!-- Street Luxe Gold / Sun Ray -->
    <linearGradient id="goldRay" x1="200" y1="120" x2="420" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="40%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Subtle Metallic Glass Border -->
    <linearGradient id="rimStroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00FFA3" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Outer Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond Squircle App Icon Style Street-Tech -->
  <rect width="512" height="512" rx="124" fill="url(#badgeGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" stroke="url(#rimStroke)" stroke-width="4"/>

  <!-- Trame de fond géométrique subtile (Vitesse / Dynamisme urbain) -->
  <g opacity="0.07" stroke="#00FFA3" stroke-width="1.5">
    <line x1="0" y1="128" x2="512" y2="128" stroke-dasharray="8 12"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke-dasharray="8 12"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke-dasharray="8 12"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke-dasharray="8 12"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke-dasharray="8 12"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke-dasharray="8 12"/>
  </g>

  <!-- HALO LUMINEUX CENTRAL -->
  <circle cx="260" cy="245" r="130" fill="#00FFA3" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- SYMBOLE MAÎTRE : LE "B" AÉRODYNAMIQUE HUSTLE & ACCÉLÉRATION -->
  <!-- 1. Colonne de Gauche (L'Élan / La Fusée / Le Pilier Aérodynamique) -->
  <path d="M148 376V136C148 124.954 156.954 116 168 116H204C215.046 116 224 124.954 224 136V376C224 387.046 215.046 396 204 396H168C156.954 396 148 387.046 148 376Z" 
        fill="url(#voltSpeed)"/>

  <!-- 2. Boucle Supérieure (L'Arc de Vélocité) -->
  <path d="M224 128C275 128 322 144 322 196C322 236 290 252 248 256C234 257 224 257 224 257V188C224 188 250 188 266 186C277 184 282 178 282 168C282 152 266 148 244 148H224V128Z" 
        fill="url(#voltSpeed)"/>

  <!-- 3. Boucle Inférieure en Flèche d'Ascension & Vitesse (L'Éclair d'Or) -->
  <path d="M224 242C240 242 270 242 292 248C334 260 366 288 366 332C366 384 316 396 262 396H192L232 356H264C288 356 318 350 318 326C318 304 292 294 266 294H224V242Z" 
        fill="url(#goldRay)" filter="url(#neonGlow)"/>

  <!-- 4. L'Éclair d'Action / Street Spike au Coeur du B -->
  <polygon points="266,220 236,276 278,276 248,336 304,260 262,260" fill="#FFFFFF"/>

  <!-- Rayon de vitesse supérieur -->
  <circle cx="348" cy="184" r="8" fill="#00FFA3" filter="url(#neonGlow)"/>
  <circle cx="388" cy="308" r="6" fill="#FFF275" filter="url(#neonGlow)"/>
</svg>
