<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073b1e"/>
      <stop offset="55%" stop-color="#0a6b34"/>
      <stop offset="100%" stop-color="#12a150"/>
    </linearGradient>
    <linearGradient id="gold" x1="40" y1="40" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fond icône -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" stroke="#2ee07f" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Escaliers montants (progression & ascension) -->
  <path d="M36 212H92V180H140V148H188V116H224V220H36V212Z" fill="url(#gold)"/>
  <path d="M36 212H92V180H140V148H188V116H224" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Personnage dynamique qui gravit les marches -->
  <!-- Tête -->
  <circle cx="126" cy="58" r="16" fill="#ffffff"/>
  <!-- Torse penché vers l'avant dans l'effort -->
  <path d="M122 78L108 124" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <!-- Jambe avant (sur la marche supérieure) -->
  <path d="M108 124L138 128L142 146" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Jambe arrière (en poussée sur la marche inférieure) -->
  <path d="M108 124L84 152L72 178" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bras tenant le sac sur l'épaule -->
  <path d="M118 88L94 78" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

  <!-- Sac sur l'épaule / dans le dos avec le symbole Dollar ($) -->
  <path d="M68 54C74 48 86 48 92 54L86 64C102 70 108 88 102 106C98 118 86 124 70 122C54 120 44 108 46 92C48 76 58 64 74 62L68 54Z" fill="url(#gold)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Symbole $ sur le sac -->
  <text x="75" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="34" fill="#073b1e">$</text>
</svg>
